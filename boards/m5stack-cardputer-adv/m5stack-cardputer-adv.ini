; PlatformIO Project Configuration File
; M5Stack Cardputer ADV — ST25R3916B NFC over I2C Port A + key recovery support
;
; Build with: pio run -e m5stack-cardputer-adv
; Upload with: pio run -e m5stack-cardputer-adv -t upload

[env:m5stack-cardputer-adv]
board = m5stack-cardputer-adv
board_build.partitions = custom_8Mb.csv
; The shared Cardputer interface already detects the ADV TCA8418 keyboard.
build_src_filter =${env.build_src_filter} +<../boards/m5stack-cardputer-adv> +<../boards/m5stack-cardputer/interface.cpp>
build_flags =
	${env.build_flags}
	-Iboards/m5stack-cardputer-adv
	-DCORE_DEBUG_LEVEL=0
	-fpermissive
	-DCORE_DEBUG_LEVEL=0

	; Cardputer ADV specific features
	-D ANALOG_BAT_PIN=10
	-DTCA8418_INT_PIN=11
	-DTCA8418_I2C_ADDR=0x34
	-DTCA8418_SDA_PIN=8
	-DTCA8418_SCL_PIN=9

	; ES8311 Codec (ADV)
	-D ES8311_CODEC=1
	-D ES8311_ADDR=0x18

	; Microphone
	-DMIC_SPM1423=1
	-DPIN_CLK=43
	-DI2S_SCLK_PIN=43
	-DI2S_DATA_PIN=46
	-DPIN_DATA=46

	; FM Radio
	-DFM_SI4713=1
	-DFM_RSTPIN=40

	; RGB LED
	-DHAS_RGB_LED=1
	-DRGB_LED=21

	; USB as HID
	-DUSB_as_HID=1

	; Buttons
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0
	-DBTN_ACT=LOW

	; IR
	-DIR_TX_PINS='{ {"Default", TXLED}, {"M5 IR Mod", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15} }'
	-DIR_RX_PINS='{ {"M5 IR Mod", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA},{"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15}}'
	-DTXLED=44
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	; RF
	-DRF_TX_PINS='{ {"M5 RF433T", GROVE_SDA}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA},{"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15}}'
	-DRF_RX_PINS='{ {"M5 RF433R", GROVE_SCL}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA},{"ADV 3", 3},{"ADV 4", 4},{"ADV 5", 5},{"ADV 6", 6},{"ADV 13", 13},{"ADV 15", 15}}'

	; CC1101 via SPI (same as CC1101)
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=GROVE_SDA
	-DCC1101_SS_PIN=SPI_SS_PIN
	-DCC1101_MOSI_PIN=SPI_MOSI_PIN
	-DCC1101_SCK_PIN=SPI_SCK_PIN
	-DCC1101_MISO_PIN=SPI_MISO_PIN

	; NRF24 via SPI
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=GROVE_SDA
	-DNRF24_SS_PIN=SPI_SS_PIN
	-DNRF24_MOSI_PIN=SPI_MOSI_PIN
	-DNRF24_SCK_PIN=SPI_SCK_PIN
	-DNRF24_MISO_PIN=SPI_MISO_PIN

	; W5500 via SPI
	-DUSE_W5500_VIA_SPI
	-DW5500_SS_PIN=SPI_SS_PIN
	-DW5500_MOSI_PIN=SPI_MOSI_PIN
	-DW5500_SCK_PIN=SPI_SCK_PIN
	-DW5500_MISO_PIN=SPI_MISO_PIN
	-DW5500_INT_PIN=GROVE_SDA

	; LoRa
	-DLORA_SCK=SPI_SCK_PIN
	-DLORA_MISO=SPI_MISO_PIN
	-DLORA_MOSI=SPI_MOSI_PIN
	-DLORA_CS=5
	-DLORA_RST=3
	-DLORA_DIO0=4

	; Screen
	-DHAS_SCREEN=1
	-DROTATION=1
	-DBACKLIGHT=38
	-DMINBRIGHT=160

	; TFT_eSPI Setup
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_2_DRIVER=1
	-DTFT_RGB_ORDER=1
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DTFT_BACKLIGHT_ON=1
	-DTFT_BL=38
	-DTFT_RST=33
	-DTFT_DC=34
	-DTFT_MOSI=35
	-DTFT_SCLK=36
	-DTFT_CS=37
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; SD Card
	-DSDCARD_CS=12
	-DSDCARD_SCK=40
	-DSDCARD_MISO=39
	-DSDCARD_MOSI=14

	; Default I2C port (Port A — shared with ST25R3916B NFC unit)
	-DGROVE_SDA=2
	-DGROVE_SCL=1
	-D SYS_I2C_SDA=-1
	-D SYS_I2C_SCL=-1

	; Default SPI port
	-DSPI_SCK_PIN=40
	-DSPI_MOSI_PIN=14
	-DSPI_MISO_PIN=39
	-DSPI_SS_PIN=GROVE_SCL

	; ST25R3916B NFC Unit — I2C on Port A (GROVE), address 0x50
	-DST25R_I2C_SDA_PIN=GROVE_SDA
	-DST25R_I2C_SCL_PIN=GROVE_SCL

	-DDEVICE_NAME='"M5Stack Cardputer ADV"'

lib_deps =
	${env.lib_deps}
	adafruit/Adafruit TCA8418 @ ^1.0.2
