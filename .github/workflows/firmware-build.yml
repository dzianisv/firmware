name: Build M5Stack Cardputer ADV Firmware

on:
  push:
    branches:
      - feature/mifare-classic-recovery-cardputer-adv
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip python3-venv python3-setuptools \
            git curl wget build-essential cmake ninja-build \
            libssl-dev libffi-dev libusb-1.0-0-dev \
            unzip zip

      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install platformio
          pio --version

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/cache
          key: ${{ runner.os }}-pio-packages-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-packages-

      - name: Build firmware (m5stack-cardputer-adv)
        run: |
          # Remove stale objects because the pre-build script patches cached core files.
          rm -rf .pio/build/m5stack-cardputer-adv
          pio run -e m5stack-cardputer-adv

      - name: Package firmware as zip
        id: package
        run: |
          BUILD_DIR=".pio/build/m5stack-cardputer-adv"
          FIRMWARE_BIN="$BUILD_DIR/firmware.bin"
          if [ ! -f "$FIRMWARE_BIN" ]; then
            echo "Firmware binary not found at $FIRMWARE_BIN"
            exit 1
          fi
          ZIP_NAME="firmware-m5stack-cardputer-adv-${{ github.run_id }}.zip"
          cd "$BUILD_DIR"
          zip -r "/tmp/$ZIP_NAME" firmware.bin firmware.elf 2>/dev/null || zip "/tmp/$ZIP_NAME" firmware.bin
          echo "zip_path=/tmp/$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "firmware_size=$(stat -c%s "$FIRMWARE_BIN")" >> $GITHUB_OUTPUT

      - name: Upload firmware zip as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-m5stack-cardputer-adv-zip
          path: ${{ steps.package.outputs.zip_path }}
          retention-days: 30

      - name: Create GitHub release (main only)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-m5stack-cardputer-adv-${{ github.run_id }}
          name: "M5Stack Cardputer ADV Firmware (${{ github.run_id }})"
          body: |
            ## M5Stack Cardputer ADV Firmware

            **Environment:** m5stack-cardputer-adv
            **Build:** ${{ github.run_id }}
            **Commit:** ${{ github.sha }}
            **Size:** ${{ steps.package.outputs.firmware_size }} bytes

            ### Features
            - ST25R3916B NFC support (I2C Port A)
            - MIFARE Classic 1K/4K/Mini read + diagnostics
            - Darkside/nested key recovery (authorized keys only)
            - MIFARE Classic diagnostic mode with per-block error classification
            - Partial-read protection (never misrepresented as complete dump)

            ### Installation
            Flash with `esptool.py` or PlatformIO:
            ```bash
            esptool.py --port /dev/ttyUSB0 write_flash 0x0 firmware.bin
            ```
          files: ${{ steps.package.outputs.zip_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print firmware info
        run: |
          echo "Firmware built successfully!"
          echo "Environment: m5stack-cardputer-adv"
          echo "Zip: ${{ steps.package.outputs.zip_path }}"
          echo "Size: ${{ steps.package.outputs.firmware_size }} bytes"
